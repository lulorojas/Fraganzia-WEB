name: Bot de precios del proveedor

on:
  schedule:
    - cron: '23 12 * * *'  # minuto 23: a las en punto GitHub demora más los programados
    - cron: '47 17 * * *'  # segunda pasada por si la primera se demora o se salta (sin cambios no hace nada ni avisa)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no escribe en Firestore)'
        type: boolean
        default: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Tests del bot
        run: npm run test:bot

      - name: Actualizar precios
        run: node tools/bot-proveedor.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRAGANZIA_E9B70 }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      - name: Subir fotos de nuevos ingresos detectadas automáticamente
        run: |
          mkdir -p public/productos-bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/productos-bot
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): fotos de nuevos ingresos detectadas automaticamente"
            git push
          fi
