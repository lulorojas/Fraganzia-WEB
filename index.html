<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fraganzia | Perfumes árabes originales en Argentina</title>
    <meta
      name="description"
      content="Perfumes árabes originales de Lattafa, Armaf, Al Haramain y más. Precios en pesos actualizados, pago por transferencia o efectivo y envíos en AMBA."
    />
    <link rel="canonical" href="https://fraganzia-e9b70.web.app/" />
    <meta name="theme-color" content="#06040D" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fraganzia" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Fraganzia | Perfumes árabes originales en Argentina" />

      property="og:description"
      content="Perfumes árabes originales con precios en pesos actualizados y envíos en AMBA."

    <meta name="twitter:card" content="summary" />

    <!-- Conexiones que la app abre apenas arranca: adelantarlas ahorra un
         round-trip en mobile. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://dolarapi.com" crossorigin />
    <!-- El logo es el elemento más grande de la home (LCP). -->
    <link
      rel="preload"
      as="image"
      href="/logo-192.webp"
      imagesrcset="/logo-96.webp 96w, /logo-192.webp 192w, /logo-256.webp 256w"
      imagesizes="(min-width: 768px) 115px, (min-width: 640px) 94px, 58px"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Fraganzia",
        "url": "https://fraganzia-e9b70.web.app/",
        "logo": "https://fraganzia-e9b70.web.app/icon-512.png",
        "image": "https://fraganzia-e9b70.web.app/icon-512.png",
        "description": "Tienda de perfumes árabes originales con envíos en AMBA.",
        "areaServed": "AR",
        "currenciesAccepted": "ARS",
        "paymentAccepted": "Transferencia bancaria, Efectivo",
        "sameAs": ["https://www.instagram.com/fraganzia.ar/"]
      }
    </script>
  </head>

    <a
