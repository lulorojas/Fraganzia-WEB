<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="instagramGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD521;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#F7A34B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E95950;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#C32AA3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7232BD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#instagramGradient)"/>
  
  <!-- Instagram camera icon -->
  <g transform="translate(8, 8)">
    <!-- Outer rounded square -->
    <rect x="0.5" y="0.5" width="15" height="15" rx="4.5" stroke="white" stroke-width="1.5" fill="none"/>
    
    <!-- Inner circle (lens) -->
    <circle cx="8" cy="8" r="3.5" stroke="white" stroke-width="1.5" fill="none"/>
    
    <!-- Top right dot -->
    <circle cx="12.5" cy="3.5" r="0.8" fill="white"/>
  </g>
</svg>
